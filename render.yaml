services:
  - type: web
    name: ghar-ka-doctor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/languages
    envVars:
      - key: SARVAM_API_KEY
        sync: false   # set in the Render dashboard — never commit it
      - key: PYTHON_VERSION
        value: 3.12.6
